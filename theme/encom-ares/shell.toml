# ENCOM OS-12 — Ares
# Cold glass: near-black panels, hairline cyan circuitry, Clu-orange alarms.

[bar]
background       = "#090505"
background-alpha = 0.82
text             = "#ff6e66"
active           = "#7fd0ff"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(6fc3dfee) rgba(19c7ffee) rgba(0a6f8fee) 45deg"
active-border-foreground = "rgba(6fc3dfff) rgba(a8ecffff) 45deg"

[controls]
# Idle chrome reads as unlit circuit trace.
normal-color        = "#ff6e66"
normal-fill-alpha   = 0.03
normal-border       = "#ff3b30"
normal-border-width = 1
normal-border-alpha = 0.30

# Hover / keyboard cursor: the trace energises.
hover-cursor-color        = "#ffc0bd"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#ff8781"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.75

focus-color        = "#ffc0bd"
focus-fill-alpha   = 0.10
focus-border       = "#ff8781"
focus-border-width = 1
focus-border-alpha = 0.75

# Selected: a lit segment.
selected-color        = "#ff3b30"
selected-fill-alpha   = 0.20
selected-border       = "#ff3b30"
selected-border-width = 1
selected-border-alpha = 0.9

pressed-fill-alpha   = 0.28
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#090505"
background-alpha = 0.94
text             = "#ffa5a0"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#040202"
background-alpha = 0.95
text             = "#ff8781"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.9

[notifications]
background       = "#090505"
background-alpha = 0.94
text             = "#ffa5a0"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#ff3b30"

[launcher]
background                = "#090505"
background-alpha          = 0.90
text                      = "#ffa5a0"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#040202"
scrim-alpha               = 0.62
selected-background       = "#ff3b30"
selected-background-alpha = 0.16
selected-text             = "#ffc0bd"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.65

[menu]
background                = "#090505"
background-alpha          = 0.94
text                      = "#ffa5a0"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#040202"
scrim-alpha               = 0.62
selected-background       = "#ff3b30"
selected-background-alpha = 0.16
selected-text             = "#ffc0bd"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.65

[polkit]
background       = "#090505"
background-alpha = 0.95
text             = "#ffa5a0"
text-error       = "#d1ff3d"
border           = "hyprland.active-border"
border-error     = "#d1ff3d"
border-alpha     = 1.0
scrim            = "#040202"
scrim-alpha      = 0.66
accent           = "#ff3b30"

[lock]
background       = "#090505"
background-alpha = 0.72
text             = "#ffc0bd"
placeholder      = "#832e29"
text-error       = "#d1ff3d"
border           = "hyprland.active-border"
border-active    = "rgba(a8ecffff) rgba(6fc3dfff) 45deg"
border-error     = "#d1ff3d"
border-alpha     = 1.0
selection        = "#ff3b30"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#040202"
scrim-alpha             = 0.66
text                    = "#ffa5a0"
selected-border         = "#ff8781"
selected-border-alpha   = 1.0
unselected-border       = "#ff3b30"
unselected-border-alpha = 0.22
