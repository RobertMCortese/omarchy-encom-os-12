# ENCOM OS-12: let the grid show behind the shell. This is foot's own alpha,
# which fades only the background cell colour -- text stays fully opaque.
# foot 1.28 uses [colors-dark]/[colors-light]; alpha lives inside those.
# alpha-mode=default leaves cells with their own background (selections,
# TUI panels) opaque.
[colors-dark]
alpha=0.80
alpha-mode=default
