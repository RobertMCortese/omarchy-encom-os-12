# TRON 2.0
# Cold glass: near-black panels, hairline cyan circuitry, Clu-orange alarms.

[bar]
background       = "#070905"
background-alpha = 0.82
text             = "#8fd54c"
active           = "#ff5a2b"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(6fc3dfee) rgba(19c7ffee) rgba(0a6f8fee) 45deg"
active-border-foreground = "rgba(6fc3dfff) rgba(a8ecffff) 45deg"

[controls]
# Idle chrome reads as unlit circuit trace.
normal-color        = "#8fd54c"
normal-fill-alpha   = 0.03
normal-border       = "#79c72f"
normal-border-width = 1
normal-border-alpha = 0.30

# Hover / keyboard cursor: the trace energises.
hover-cursor-color        = "#b2fd6b"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#99fc3b"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.75

focus-color        = "#b2fd6b"
focus-fill-alpha   = 0.10
focus-border       = "#99fc3b"
focus-border-width = 1
focus-border-alpha = 0.75

# Selected: a lit segment.
selected-color        = "#79c72f"
selected-fill-alpha   = 0.20
selected-border       = "#79c72f"
selected-border-width = 1
selected-border-alpha = 0.9

pressed-fill-alpha   = 0.28
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#070905"
background-alpha = 0.94
text             = "#a6ed64"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#030402"
background-alpha = 0.95
text             = "#99fc3b"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.9

[notifications]
background       = "#070905"
background-alpha = 0.94
text             = "#a6ed64"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#79c72f"

[launcher]
background                = "#070905"
background-alpha          = 0.90
text                      = "#a6ed64"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#030402"
scrim-alpha               = 0.62
selected-background       = "#79c72f"
selected-background-alpha = 0.16
selected-text             = "#b2fd6b"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.65

[menu]
background                = "#070905"
background-alpha          = 0.94
text                      = "#a6ed64"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#030402"
scrim-alpha               = 0.62
selected-background       = "#79c72f"
selected-background-alpha = 0.16
selected-text             = "#b2fd6b"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.65

[polkit]
background       = "#070905"
background-alpha = 0.95
text             = "#a6ed64"
text-error       = "#ff6b3d"
border           = "hyprland.active-border"
border-error     = "#ff6b3d"
border-alpha     = 1.0
scrim            = "#030402"
scrim-alpha      = 0.66
accent           = "#79c72f"

[lock]
background       = "#070905"
background-alpha = 0.72
text             = "#b2fd6b"
placeholder      = "#455c2f"
text-error       = "#ff6b3d"
border           = "hyprland.active-border"
border-active    = "rgba(a8ecffff) rgba(6fc3dfff) 45deg"
border-error     = "#ff6b3d"
border-alpha     = 1.0
selection        = "#79c72f"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#030402"
scrim-alpha             = 0.66
text                    = "#a6ed64"
selected-border         = "#99fc3b"
selected-border-alpha   = 1.0
unselected-border       = "#79c72f"
unselected-border-alpha = 0.22
