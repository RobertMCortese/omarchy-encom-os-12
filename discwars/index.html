<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disc Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* The arena commits to its own world: a dark screen in the current
     theme's ink, whatever the host is wearing. Every colour here comes
     from the palette the scene is drawn in, so the chrome and the duel
     change together. */
  :root {
    --ink: #010306;
    --accent: #6fc3df;
    --accent-hi: #a8ecff;
    --side-a: #6fc3df;
    --side-b: #ff8c21;
    --chrome: rgba(168, 236, 255, 0.72);
    --chrome-dim: rgba(168, 236, 255, 0.34);
    --rule: rgba(168, 236, 255, 0.16);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--chrome);
    font-family: var(--mono);
    overflow: hidden;
  }
  .stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* The scoreboard: side names, a pip per fighter (dark once it is out) and
     the rounds won. Unlike the rest of the chrome this stays up as a
     screensaver -- who is still standing is the scene, not furniture. */
  #board {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    text-align: center; pointer-events: none; user-select: none;
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.28em; color: var(--chrome);
  }
  #board .a { color: var(--side-a); }
  #board .b { color: var(--side-b); }
  #board span { opacity: 0.85; margin: 0 10px; }
  #board b { font-weight: 600; margin: 0 14px; color: var(--accent-hi); }
  #board i {
    display: inline-block; width: 14px; height: 3px; margin: 0 3px 2px;
    vertical-align: middle; background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }
  #board i.out { opacity: 0.16; box-shadow: none; }
  /* The one that came through, and what it is carrying. */
  #board .champ {
    margin-top: 7px; font-size: 9px; letter-spacing: 0.26em;
    color: var(--chrome-dim);
  }
  #board .champ b { font-weight: 600; letter-spacing: 0.3em; }
  #board .champ b.a { color: var(--side-a); }
  #board .champ b.b { color: var(--side-b); }
  /* What the champion has learned to do, named. */
  #board .palette {
    margin-top: 5px; font-size: 8.5px; letter-spacing: 0.2em;
    color: var(--chrome-dim); opacity: 0.85;
  }
  #board .palette i { font-style: normal; opacity: 0.45; margin: 0 5px; }
  #board .palette b { font-weight: 400; }
  #board .palette b.counter { color: var(--accent-hi); opacity: 0.95; }
  #board .palette b.guarded { color: var(--chrome); opacity: 0.95; }
  #board .palette b.press { opacity: 0.7; }
  #board .banner {
    margin-top: 12px; font-size: 13px; letter-spacing: 0.5em;
    color: var(--accent-hi);
  }
  /* At phone width the ident and the board share the top, so the names go
     and the pips and the score carry it. */
  @media (max-width: 620px) {
    #board { font-size: 10px; letter-spacing: 0.18em; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
    #board span.side { display: none; }
    /* The one that came through, and what it is carrying. */
  #board .champ {
    margin-top: 7px; font-size: 9px; letter-spacing: 0.26em;
    color: var(--chrome-dim);
  }
  #board .champ b { font-weight: 600; letter-spacing: 0.3em; }
  #board .champ b.a { color: var(--side-a); }
  #board .champ b.b { color: var(--side-b); }
  /* What the champion has learned to do, named. */
  #board .palette {
    margin-top: 5px; font-size: 8.5px; letter-spacing: 0.2em;
    color: var(--chrome-dim); opacity: 0.85;
  }
  #board .palette i { font-style: normal; opacity: 0.45; margin: 0 5px; }
  #board .palette b { font-weight: 400; }
  #board .palette b.counter { color: var(--accent-hi); opacity: 0.95; }
  #board .palette b.guarded { color: var(--chrome); opacity: 0.95; }
  #board .palette b.press { opacity: 0.7; }
  #board .banner { font-size: 11px; letter-spacing: 0.34em; }
  }

  /* Chrome rests over the scene and steps back while you watch. */
  .chrome {
    position: absolute; inset: 0;
    pointer-events: none;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between;
    transition: opacity 700ms ease;
  }
  .chrome.resting { opacity: 0.22; }
  .chrome > * { pointer-events: auto; }

  .ident { display: flex; align-items: center; gap: 10px; }
  .ident svg { width: 26px; height: 26px; flex: none; }
  .ident .marks { display: flex; flex-direction: column; gap: 2px; }
  .ident .brand {
    font-size: 11px; font-weight: 700; letter-spacing: 0.34em;
    text-transform: uppercase; color: var(--chrome);
  }
  .ident .sub {
    font-size: 9.5px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--chrome-dim);
  }

  .foot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .palettes, .sizes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .palette, .size {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 6px 10px;
    font: inherit; font-size: 9.5px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--chrome-dim);
    transition: border-color 200ms ease, color 200ms ease;
  }
  .palette:hover, .palette:focus-visible,
  .size:hover, .size:focus-visible { color: var(--chrome); border-color: var(--chrome-dim); }
  .palette[aria-pressed="true"], .size[aria-pressed="true"] { color: var(--chrome); border-color: var(--accent); }
  .palette:focus-visible, .size:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The match size reads as a count, so it gets the wider tracking of a label. */
  .size { letter-spacing: 0.24em; }
  /* Off until asked for: a browser will not start audio unasked anyway, and
     nor should a page that opens itself. */
  .sound { letter-spacing: 0.24em; }
  .sound[aria-pressed="true"] { color: var(--chrome); border-color: var(--accent); }
  /* Each chip carries the two colours its fighters wear. */
  .swatch { display: inline-flex; gap: 3px; }
  .swatch i { width: 7px; height: 7px; border-radius: 50%; display: block; }

  .hint {
    font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--chrome-dim);
  }
  /* What the two policies have come to: how often each side aims high, at
     the body or low, and how often it answers with each guard. Diagnostic
     rather than scene, so it lives with the chrome and goes as a screensaver. */
  .brains {
    display: grid; grid-template-columns: auto repeat(2, auto); gap: 4px 18px;
    align-items: center; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--chrome-dim);
  }
  .brains .who { text-align: right; letter-spacing: 0.2em; }
  .brains .who.a { color: var(--side-a); }
  .brains .who.b { color: var(--side-b); }
  .brains .mix { display: flex; align-items: center; gap: 5px; }
  .brains .mix.a { color: var(--side-a); }
  .brains .mix.b { color: var(--side-b); }
  .brains .mix em { font-style: normal; opacity: 0.5; }
  /* The faded track and the lit fill are siblings, not one inside the
     other: opacity applies to a whole subtree, so a fill nested in a faded
     track can never be brighter than it. A bar also has to be told to be a
     box at all, since <i> is inline by default. */
  .brains .bar {
    display: inline-block; position: relative;
    width: 26px; height: 3px; vertical-align: middle;
  }
  .brains .track, .brains .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: currentColor;
  }
  .brains .track { right: 0; opacity: 0.2; }
  .brains .head { font-size: 8px; letter-spacing: 0.22em; opacity: 0.5; }
  @media (max-width: 620px) { .brains { display: none; } }

  .credit {
    font-size: 9px; letter-spacing: 0.04em; color: var(--chrome-dim);
    text-align: center; max-width: 86ch; line-height: 1.7; margin: 0;
  }
  .credit a { color: inherit; }

  /* Offered instead of autoplay when the viewer asks for less motion. */
  .curtain {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: var(--ink);
  }
  .curtain.on { display: flex; }
  .start {
    background: transparent; cursor: pointer; font: inherit;
    border: 1px solid var(--accent); border-radius: 2px;
    color: var(--chrome); padding: 14px 26px;
    font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
  }
  .start:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Run as a screensaver or the desktop background: the duel, and nothing else. */
  body.embedded .chrome { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .chrome, .palette { transition: none; }
  }

  @media (max-width: 560px) {
    .ident .brand { font-size: 10px; letter-spacing: 0.24em; }
    .palette, .size { padding: 5px 8px; font-size: 9px; letter-spacing: 0.12em; }
    /* What the two policies have come to: how often each side aims high, at
     the body or low, and how often it answers with each guard. Diagnostic
     rather than scene, so it lives with the chrome and goes as a screensaver. */
  .brains {
    display: grid; grid-template-columns: auto repeat(2, auto); gap: 4px 18px;
    align-items: center; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--chrome-dim);
  }
  .brains .who { text-align: right; letter-spacing: 0.2em; }
  .brains .who.a { color: var(--side-a); }
  .brains .who.b { color: var(--side-b); }
  .brains .mix { display: flex; align-items: center; gap: 5px; }
  .brains .mix.a { color: var(--side-a); }
  .brains .mix.b { color: var(--side-b); }
  .brains .mix em { font-style: normal; opacity: 0.5; }
  /* The faded track and the lit fill are siblings, not one inside the
     other: opacity applies to a whole subtree, so a fill nested in a faded
     track can never be brighter than it. A bar also has to be told to be a
     box at all, since <i> is inline by default. */
  .brains .bar {
    display: inline-block; position: relative;
    width: 26px; height: 3px; vertical-align: middle;
  }
  .brains .track, .brains .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: currentColor;
  }
  .brains .track { right: 0; opacity: 0.2; }
  .brains .head { font-size: 8px; letter-spacing: 0.22em; opacity: 0.5; }
  @media (max-width: 620px) { .brains { display: none; } }

  .credit { font-size: 8.5px; }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="arena" aria-label="Two figures duelling with identity discs on floating rings"></canvas>

  <div id="board" aria-live="polite"></div>

  <div class="chrome" id="chrome">
    <div class="ident">
      <!-- The identity disc: a ring broken at the top, as it sits in its dock. -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="2"
                stroke-dasharray="58 24" transform="rotate(-115 16 16)"/>
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--accent-hi)" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="1.6" fill="var(--accent-hi)"/>
      </svg>
      <div class="marks">
        <div class="brand" id="brand">ENCOM OS-12</div>
        <div class="sub">Disc Wars</div>
      </div>
    </div>

    <div class="foot">
      <div class="brains" id="brains" hidden></div>
      <div class="sizes" id="sizes" role="group" aria-label="Match size">
        <button type="button" class="palette sound" id="sound" aria-pressed="false">Sound</button>
      </div>
      <div class="palettes" id="palettes" role="group" aria-label="Colour scheme"></div>
      <p class="hint">Click the arena to hold it</p>
      <p class="credit">
        Motion captured from the
        <a href="http://mocap.cs.cmu.edu/">CMU Graphics Lab Motion Capture Database</a>.
        An original scene from the ENCOM OS-12 desktop theme — a fan work, not affiliated
        with or endorsed by Disney.
      </p>
    </div>
  </div>

  <div class="curtain" id="curtain">
    <button class="start" id="start" type="button">Begin the duel</button>
  </div>
</div>

<script src="palette.js?v=e46f3c02"></script>
<script src="vector.js?v=4ec43c23"></script>
<script src="learn.js?v=d1de0737"></script>
<script src="sound.js?v=af825e47"></script>
<script src="poses.js?v=573e2db4"></script>
<script src="discwars.js?v=44374e49"></script>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("arena");
  var chrome = document.getElementById("chrome");
  var brand = document.getElementById("brand");
  var curtain = document.getElementById("curtain");
  var root = document.documentElement;

  // Chip per theme, each showing the two colours its fighters wear.
  var BRANDS = {
    "tron-legacy": "ENCOM OS-12", "clu": "ENCOM OS-12", "tron-1982": "ENCOM OS-12",
    "tron-uprising": "ENCOM OS-12", "tron-2-0": "ENCOM OS-12",
    "dillinger-systems": "Dillinger Systems"
  };
  var box = document.getElementById("palettes");
  var chips = {};
  Object.keys(DiscWars.themes).forEach(function (key) {
    var t = DiscWars.themes[key];
    var b = document.createElement("button");
    b.type = "button";
    b.className = "palette";
    b.id = "palette-" + key;
    b.setAttribute("aria-pressed", key === "tron-legacy" ? "true" : "false");
    b.innerHTML = '<span class="swatch"><i style="background:' + t.sideA +
                  '"></i><i style="background:' + t.sideB + '"></i></span>' + t.name;
    b.addEventListener("click", function () { choose(key); });
    box.appendChild(b);
    chips[key] = b;
  });

  function choose(key) {
    var t = DiscWars.themes[key];
    DiscWars.setTheme(key);
    dress(t);
    brand.textContent = BRANDS[key] || "ENCOM OS-12";
    Object.keys(chips).forEach(function (k) {
      chips[k].setAttribute("aria-pressed", String(k === key));
    });
  }

  // Put the page's own chrome in the same colours as the arena.
  function dress(t) {
    root.style.setProperty("--ink", t.ink || "#010306");
    root.style.setProperty("--accent", t.accent || "#6fc3df");
    root.style.setProperty("--side-a", t.sideA || "#6fc3df");
    root.style.setProperty("--side-b", t.sideB || "#ff8c21");
    var hi = t.accentHi || "#a8ecff";
    root.style.setProperty("--accent-hi", hi);
    root.style.setProperty("--chrome", tint(hi, 0.72));
    root.style.setProperty("--chrome-dim", tint(hi, 0.34));
    root.style.setProperty("--rule", tint(hi, 0.16));
    if (t.brand) brand.textContent = t.brand;
  }

  function tint(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  // The chrome steps back while you watch and comes up on any input.
  var hintLine = document.querySelector(".hint");
  var HINT = hintLine ? hintLine.textContent : "";
  var liveTimer = 0;
  function watchLive(n) {
    clearTimeout(liveTimer);
    if (!window.DiscWarsSound || !DiscWarsSound.on) { hintLine.textContent = HINT; return; }
    if (DiscWarsSound.live) { hintLine.textContent = HINT; return; }
    if (n > 6) {
      hintLine.textContent = "Waiting for this tab to be in front before it can play";
    }
    liveTimer = setTimeout(function () { watchLive(n + 1); }, 400);
  }
  var restTimer = 0;
  function stir() {
    chrome.classList.remove("resting");
    clearTimeout(restTimer);
    restTimer = setTimeout(function () { chrome.classList.add("resting"); }, 2600);
  }
  ["pointermove", "pointerdown", "keydown"].forEach(function (e) {
    window.addEventListener(e, stir, { passive: true });
  });
  stir();

  // Click the arena to hold it; the chrome and the chips stay live.
  var held = false;
  canvas.addEventListener("click", function () {
    if (embedded) return;                 // input ends a screensaver; it does not pause it
    held = !held;
    DiscWars.setPaused(held);
    if (window.DiscWarsSound && DiscWarsSound.on && held) DiscWarsSound.stop();
  });

  // Run by the Boardroom server as a screensaver or the desktop background:
  // no chrome, and the colours come from the desktop's own theme rather than
  // from the chips. Opened from any other server, neither applies.
  var hash = /^#(screensaver|wallpaper)(?::(\w+))?/.exec(location.hash);
  var embedded = !!hash;
  var themed = window.encomPalette && Object.keys(window.encomPalette).length > 0;
  if (embedded) document.body.classList.add("embedded");

  // Match size: whatever the host asked for (#screensaver:3), else ?teams=,
  // else what this viewer chose last, else the duel.
  function wantedTeams() {
    if (hash && /^[123]$/.test(hash[2] || "")) return Number(hash[2]);
    var q = /[?&]teams=([123])\b/.exec(location.search);
    if (q) return Number(q[1]);
    try {
      var saved = localStorage.getItem("discwars.teams");
      if (saved && /^[123]$/.test(saved)) return Number(saved);
    } catch (e) { /* private window, blocked storage: the duel is a fine default */ }
    return 1;
  }
  var teams = wantedTeams();

  var sizeBox = document.getElementById("sizes");
  var sizeChips = {};
  [1, 2, 3].forEach(function (n) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "size";
    b.id = "size-" + n;
    b.textContent = n + "v" + n;
    b.setAttribute("aria-pressed", String(n === teams));
    b.addEventListener("click", function () { setTeams(n); });
    sizeBox.appendChild(b);
    sizeChips[n] = b;
  });

  function setTeams(n) {
    // Guard against a cached engine older than this page. Script URLs carry a
    // hash of their contents so the two cannot normally drift apart, but a
    // stale proxy or a hard-held cache still can, and the failure to avoid is
    // the silent one: a control that looks live and does nothing at all.
    if (typeof DiscWars.setTeams !== "function") { stale(); return; }
    teams = n;
    Object.keys(sizeChips).forEach(function (k) {
      sizeChips[k].setAttribute("aria-pressed", String(Number(k) === n));
    });
    DiscWars.setTeams(n);
    boardKey = null; brainsKey = null;
    drawBoard(); drawBrains();
    try { localStorage.setItem("discwars.teams", String(n)); } catch (e) { /* fine */ }
  }

  // Say so, and offer the one thing that fixes it.
  var saidStale = false;
  function stale() {
    if (saidStale) return;
    saidStale = true;
    var hint = document.querySelector(".hint");
    hint.textContent = "This page is newer than the copy your browser cached \u2014 reload to switch sides";
    hint.style.color = "var(--accent)";
  }

  // ── Scoreboard ────────────────────────────────────────────────────────
  // Redrawn only when something it shows has changed, so a round of nothing
  // happening costs one string comparison every quarter second.
  var board = document.getElementById("board");
  var boardKey = null;
  function drawBoard() {
    if (typeof DiscWars.state !== "function") return;
    var st = DiscWars.state();
    var flags = st.fighters.map(function (f) { return f.alive ? "1" : "0"; }).join("");
    var ch = null;
    for (var i = 0; i < st.fighters.length; i++) if (st.fighters[i].champion) ch = st.fighters[i];
    var key = st.score.join(":") + "|" + st.banner + "|" + flags +
              "|" + (ch ? ch.name + ch.points + ch.stats.rounds + (ch.rank || "") +
                          (ch.combos || []).map(function (c) { return c.name + c.used; }).join() : "");
    if (key === boardKey) return;
    boardKey = key;

    function pips(team) {
      return st.fighters.filter(function (f) { return f.team === team; })
        .map(function (f) {
          return '<i class="' + (team === 0 ? "a" : "b") + (f.alive ? "" : " out") + '"></i>';
        }).join("");
    }
    board.innerHTML =
      '<span class="side a">' + st.sides[0] + "</span>" + pips(0) +
      "<b>" + st.score[0] + " : " + st.score[1] + "</b>" +
      pips(1) + '<span class="side b">' + st.sides[1] + "</span>" +
      (ch ? '<div class="champ">' + (ch.rank || "CHAMPION") + ' <b class="' + (ch.team === 0 ? "a" : "b") + '">' +
            ch.name + "</b> \u00b7 " + ch.stats.rounds +
            (ch.stats.rounds === 1 ? " ROUND HELD" : " ROUNDS HELD") +
            " \u00b7 " + ch.points + " PTS \u00b7 " + ch.stats.kills +
            (ch.stats.kills === 1 ? " KILL" : " KILLS") + "</div>" +
            (ch.combos && ch.combos.length
              ? '<div class="palette">' + ch.combos.map(function (c) {
                  // A counter answers a guard it has just had to use; a press
                  // is an opening it starts itself.
                  // What kind of move it is, at a glance: an answer, a
                  // finish, or something defensive.
                  var MARK = { guard: "\u21b5\u2009", finish: "\u21af\u2009",
                               save: "\u25c7\u2009", catch: "\u25c7\u2009",
                               climb: "\u21a5\u2009" };
                  var mark = MARK[c.trig] || "";
                  var cls = c.trig === "press" || c.trig === "aim" ? "press"
                          : (c.trig === "save" || c.trig === "catch" || c.trig === "climb")
                            ? "guarded" : "counter";
                  return '<b class="' + cls + '">' +
                         mark + c.name + (c.used > 1 ? " \u00d7" + c.used : "") + "</b>";
                }).join("<i>\u00b7</i>") + "</div>"
              : "") : "") +
      (st.banner ? '<div class="banner">' + st.banner + "</div>" : "");
  }
  // ── What the sides have learned ───────────────────────────────────────
  var brainsBox = document.getElementById("brains");
  var brainsKey = null;
  var AIM_LABELS = ["HI", "MID", "LO"];
  var GUARD_LABELS = ["DUCK", "BLOCK", "JUMP"];

  function mixRow(side, labels, mix) {
    return '<div class="mix ' + side + '">' + mix.map(function (v, i) {
      return "<em>" + labels[i] + '</em><i class="bar"><b class="track"></b>' +
             '<b class="fill" style="width:' +
             Math.round(Math.max(0, Math.min(1, v)) * 100) + '%"></b></i>';
    }).join("") + "</div>";
  }

  function drawBrains() {
    if (typeof DiscWars.state !== "function") return;
    var L = DiscWars.state().learning;
    if (!L) { brainsBox.hidden = true; return; }      // played blind
    brainsBox.hidden = false;
    var key = L.map(function (b) {
      return b.aims.concat(b.guards).map(function (v) { return v.toFixed(2); }).join(",");
    }).join("|");
    if (key === brainsKey) return;
    brainsKey = key;
    var rows = '<div class="head"></div><div class="head">Aims at</div><div class="head">Answers with</div>';
    L.forEach(function (b, t) {
      rows += '<div class="who ' + (t === 0 ? "a" : "b") + '">' +
              (t === 0 ? "PROGRAMS" : "SENTINELS") + "</div>" +
              mixRow(t === 0 ? "a" : "b", AIM_LABELS, b.aims) +
              mixRow(t === 0 ? "a" : "b", GUARD_LABELS, b.guards);
    });
    brainsBox.innerHTML = rows;
  }

  setInterval(drawBoard, 250);
  setInterval(drawBrains, 600);

  // ── Sound ─────────────────────────────────────────────────────────────
  // The fight drives a 120 BPM sequencer: a throw is a chromatic run half a
  // measure long, a block a whole one, both held to the next eighth so they
  // land on the beat. Starting it needs a click -- browsers require one
  // before any audio, and a page that made noise on open would deserve it.
  var soundBtn = document.getElementById("sound");
  var soundReady = !!window.DiscWarsSound;
  if (!soundReady) {
    soundBtn.hidden = true;
  } else {
    DiscWars.on(function (kind, info) {
      // "out" shapes the tempo, "round" both that and the held notes;
      // everything else is a sound.
      if (kind === "out") DiscWarsSound.mark(kind);
      else if (kind === "round") { DiscWarsSound.mark(kind); DiscWarsSound.play(kind, info); }
      else DiscWarsSound.play(kind, info);
    });
    // The tempo rises with every fighter knocked out, so show where it is.
    setInterval(function () {
      if (!DiscWarsSound.on) return;
      var want = "Sound \u00b7 " + DiscWarsSound.bpm;
      if (soundBtn.textContent !== want) soundBtn.textContent = want;
    }, 400);
    // ?sound=1 asks for it without a click. A browser will usually still
    // want one before letting any audio through, and the retry above takes
    // care of that; it is here for a window started deliberately with the
    // autoplay restriction lifted, which is how the desktop would run it.
    if (/[?&]sound=1\b/.test(location.search)) {
      setTimeout(function () {
        if (!DiscWarsSound.on && DiscWarsSound.start()) {
          soundBtn.setAttribute("aria-pressed", "true");
          watchLive(0);
        }
      }, 300);
    }

    soundBtn.addEventListener("click", function () {
      if (DiscWarsSound.on) {
        DiscWarsSound.stop();
        soundBtn.setAttribute("aria-pressed", "false");
        soundBtn.textContent = "Sound";
        watchLive(0);
        return;
      }
      if (!DiscWarsSound.start()) { soundBtn.hidden = true; return; }   // no Web Audio here
      soundBtn.setAttribute("aria-pressed", "true");
      // Sound stays on; what is in doubt is whether the browser has let the
      // audio through yet. Watch for a couple of seconds and say so if it
      // has not, then keep watching -- it starts by itself the moment the
      // tab comes to the front.
      watchLive(0);
    });
  }

  var still = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (still.matches) {
    // Asked for less motion: show the first frame and wait to be invited.
    curtain.classList.add("on");
    document.getElementById("start").addEventListener("click", function () {
      curtain.classList.remove("on");
      begin();
    });
  } else {
    begin();
  }

  function begin() {
    DiscWars.init(canvas, teams);
    drawBoard();
    if (themed) {
      DiscWars.setPalette(window.encomPalette);
      dress(window.encomPalette);
      Object.keys(chips).forEach(function (k) {
        chips[k].setAttribute("aria-pressed", "false");
      });
    } else {
      choose("tron-legacy");
    }
  }
})();
</script>
</body>
</html>
