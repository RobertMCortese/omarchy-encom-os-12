<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disc Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* The arena commits to its own world: a dark screen in the current
     theme's ink, whatever the host is wearing. Every colour here comes
     from the palette the scene is drawn in, so the chrome and the duel
     change together. */
  :root {
    --ink: #010306;
    --accent: #6fc3df;
    --accent-hi: #a8ecff;
    --side-a: #6fc3df;
    --side-b: #ff8c21;
    --chrome: rgba(168, 236, 255, 0.72);
    --chrome-dim: rgba(168, 236, 255, 0.34);
    --rule: rgba(168, 236, 255, 0.16);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--chrome);
    font-family: var(--mono);
    overflow: hidden;
  }
  .stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Chrome rests over the scene and steps back while you watch. */
  .chrome {
    position: absolute; inset: 0;
    pointer-events: none;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between;
    transition: opacity 700ms ease;
  }
  .chrome.resting { opacity: 0.22; }
  .chrome > * { pointer-events: auto; }

  .ident { display: flex; align-items: center; gap: 10px; }
  .ident svg { width: 26px; height: 26px; flex: none; }
  .ident .marks { display: flex; flex-direction: column; gap: 2px; }
  .ident .brand {
    font-size: 11px; font-weight: 700; letter-spacing: 0.34em;
    text-transform: uppercase; color: var(--chrome);
  }
  .ident .sub {
    font-size: 9.5px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--chrome-dim);
  }

  .foot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .palettes, .sizes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .palette, .size {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 6px 10px;
    font: inherit; font-size: 9.5px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--chrome-dim);
    transition: border-color 200ms ease, color 200ms ease;
  }
  .palette:hover, .palette:focus-visible,
  .size:hover, .size:focus-visible { color: var(--chrome); border-color: var(--chrome-dim); }
  .palette[aria-pressed="true"], .size[aria-pressed="true"] { color: var(--chrome); border-color: var(--accent); }
  .palette:focus-visible, .size:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The match size reads as a count, so it gets the wider tracking of a label. */
  .size { letter-spacing: 0.24em; }
  /* Each chip carries the two colours its fighters wear. */
  .swatch { display: inline-flex; gap: 3px; }
  .swatch i { width: 7px; height: 7px; border-radius: 50%; display: block; }

  .hint {
    font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--chrome-dim);
  }
  .credit {
    font-size: 9px; letter-spacing: 0.04em; color: var(--chrome-dim);
    text-align: center; max-width: 86ch; line-height: 1.7; margin: 0;
  }
  .credit a { color: inherit; }

  /* Offered instead of autoplay when the viewer asks for less motion. */
  .curtain {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: var(--ink);
  }
  .curtain.on { display: flex; }
  .start {
    background: transparent; cursor: pointer; font: inherit;
    border: 1px solid var(--accent); border-radius: 2px;
    color: var(--chrome); padding: 14px 26px;
    font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
  }
  .start:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Run as a screensaver or the desktop background: the duel, and nothing else. */
  body.embedded .chrome { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .chrome, .palette { transition: none; }
  }

  @media (max-width: 560px) {
    .ident .brand { font-size: 10px; letter-spacing: 0.24em; }
    .palette, .size { padding: 5px 8px; font-size: 9px; letter-spacing: 0.12em; }
    .credit { font-size: 8.5px; }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="arena" aria-label="Two figures duelling with identity discs on floating rings"></canvas>

  <div class="chrome" id="chrome">
    <div class="ident">
      <!-- The identity disc: a ring broken at the top, as it sits in its dock. -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="2"
                stroke-dasharray="58 24" transform="rotate(-115 16 16)"/>
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--accent-hi)" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="1.6" fill="var(--accent-hi)"/>
      </svg>
      <div class="marks">
        <div class="brand" id="brand">ENCOM OS-12</div>
        <div class="sub">Disc Wars</div>
      </div>
    </div>

    <div class="foot">
      <div class="sizes" id="sizes" role="group" aria-label="Match size"></div>
      <div class="palettes" id="palettes" role="group" aria-label="Colour scheme"></div>
      <p class="hint">Click the arena to hold it</p>
      <p class="credit">
        Motion captured from the
        <a href="http://mocap.cs.cmu.edu/">CMU Graphics Lab Motion Capture Database</a>.
        An original scene from the ENCOM OS-12 desktop theme — a fan work, not affiliated
        with or endorsed by Disney.
      </p>
    </div>
  </div>

  <div class="curtain" id="curtain">
    <button class="start" id="start" type="button">Begin the duel</button>
  </div>
</div>

<script src="palette.js?v=e46f3c02"></script>
<script src="poses.js?v=573e2db4"></script>
<script src="discwars.js?v=af3104ca"></script>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("arena");
  var chrome = document.getElementById("chrome");
  var brand = document.getElementById("brand");
  var curtain = document.getElementById("curtain");
  var root = document.documentElement;

  // Chip per theme, each showing the two colours its fighters wear.
  var BRANDS = {
    "tron-legacy": "ENCOM OS-12", "clu": "ENCOM OS-12", "tron-1982": "ENCOM OS-12",
    "tron-uprising": "ENCOM OS-12", "tron-2-0": "ENCOM OS-12",
    "dillinger-systems": "Dillinger Systems"
  };
  var box = document.getElementById("palettes");
  var chips = {};
  Object.keys(DiscWars.themes).forEach(function (key) {
    var t = DiscWars.themes[key];
    var b = document.createElement("button");
    b.type = "button";
    b.className = "palette";
    b.id = "palette-" + key;
    b.setAttribute("aria-pressed", key === "tron-legacy" ? "true" : "false");
    b.innerHTML = '<span class="swatch"><i style="background:' + t.sideA +
                  '"></i><i style="background:' + t.sideB + '"></i></span>' + t.name;
    b.addEventListener("click", function () { choose(key); });
    box.appendChild(b);
    chips[key] = b;
  });

  function choose(key) {
    var t = DiscWars.themes[key];
    DiscWars.setTheme(key);
    dress(t);
    brand.textContent = BRANDS[key] || "ENCOM OS-12";
    Object.keys(chips).forEach(function (k) {
      chips[k].setAttribute("aria-pressed", String(k === key));
    });
  }

  // Put the page's own chrome in the same colours as the arena.
  function dress(t) {
    root.style.setProperty("--ink", t.ink || "#010306");
    root.style.setProperty("--accent", t.accent || "#6fc3df");
    var hi = t.accentHi || "#a8ecff";
    root.style.setProperty("--accent-hi", hi);
    root.style.setProperty("--chrome", tint(hi, 0.72));
    root.style.setProperty("--chrome-dim", tint(hi, 0.34));
    root.style.setProperty("--rule", tint(hi, 0.16));
    if (t.brand) brand.textContent = t.brand;
  }

  function tint(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  // The chrome steps back while you watch and comes up on any input.
  var restTimer = 0;
  function stir() {
    chrome.classList.remove("resting");
    clearTimeout(restTimer);
    restTimer = setTimeout(function () { chrome.classList.add("resting"); }, 2600);
  }
  ["pointermove", "pointerdown", "keydown"].forEach(function (e) {
    window.addEventListener(e, stir, { passive: true });
  });
  stir();

  // Click the arena to hold it; the chrome and the chips stay live.
  var held = false;
  canvas.addEventListener("click", function () {
    if (embedded) return;                 // input ends a screensaver; it does not pause it
    held = !held;
    DiscWars.setPaused(held);
  });

  // Run by the Boardroom server as a screensaver or the desktop background:
  // no chrome, and the colours come from the desktop's own theme rather than
  // from the chips. Opened from any other server, neither applies.
  var hash = /^#(screensaver|wallpaper)(?::(\w+))?/.exec(location.hash);
  var embedded = !!hash;
  var themed = window.encomPalette && Object.keys(window.encomPalette).length > 0;
  if (embedded) document.body.classList.add("embedded");

  // Match size: whatever the host asked for (#screensaver:3), else ?teams=,
  // else what this viewer chose last, else the duel.
  function wantedTeams() {
    if (hash && /^[123]$/.test(hash[2] || "")) return Number(hash[2]);
    var q = /[?&]teams=([123])\b/.exec(location.search);
    if (q) return Number(q[1]);
    try {
      var saved = localStorage.getItem("discwars.teams");
      if (saved && /^[123]$/.test(saved)) return Number(saved);
    } catch (e) { /* private window, blocked storage: the duel is a fine default */ }
    return 1;
  }
  var teams = wantedTeams();

  var sizeBox = document.getElementById("sizes");
  var sizeChips = {};
  [1, 2, 3].forEach(function (n) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "size";
    b.id = "size-" + n;
    b.textContent = n + "v" + n;
    b.setAttribute("aria-pressed", String(n === teams));
    b.addEventListener("click", function () { setTeams(n); });
    sizeBox.appendChild(b);
    sizeChips[n] = b;
  });

  function setTeams(n) {
    // Guard against a cached engine older than this page. Script URLs carry a
    // hash of their contents so the two cannot normally drift apart, but a
    // stale proxy or a hard-held cache still can, and the failure to avoid is
    // the silent one: a control that looks live and does nothing at all.
    if (typeof DiscWars.setTeams !== "function") { stale(); return; }
    teams = n;
    Object.keys(sizeChips).forEach(function (k) {
      sizeChips[k].setAttribute("aria-pressed", String(Number(k) === n));
    });
    DiscWars.setTeams(n);
    try { localStorage.setItem("discwars.teams", String(n)); } catch (e) { /* fine */ }
  }

  // Say so, and offer the one thing that fixes it.
  var saidStale = false;
  function stale() {
    if (saidStale) return;
    saidStale = true;
    var hint = document.querySelector(".hint");
    hint.textContent = "This page is newer than the copy your browser cached \u2014 reload to switch sides";
    hint.style.color = "var(--accent)";
  }

  var still = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (still.matches) {
    // Asked for less motion: show the first frame and wait to be invited.
    curtain.classList.add("on");
    document.getElementById("start").addEventListener("click", function () {
      curtain.classList.remove("on");
      begin();
    });
  } else {
    begin();
  }

  function begin() {
    DiscWars.init(canvas, teams);
    if (themed) {
      DiscWars.setPalette(window.encomPalette);
      dress(window.encomPalette);
      Object.keys(chips).forEach(function (k) {
        chips[k].setAttribute("aria-pressed", "false");
      });
    } else {
      choose("tron-legacy");
    }
  }
})();
</script>
</body>
</html>
